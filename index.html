<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>清风数独</title>
  <style>
    :root {
      --bg: #f9f7f4;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-soft: rgba(255, 255, 255, 0.76);
      --surface-pressed: rgba(44, 95, 95, 0.08);
      --text: #474a4c;
      --muted: #8a8f93;
      --player: #2c5f5f;
      --line: #ededef;
      --line-strong: #d0d3d6;
      --frame: #dcdee0;
      --selected: #e7efed;
      --peer: #f4f6f5;
      --same: #edf3f1;
      --conflict: #faefef;
      --conflict-line: #d9b5b5;
      --shadow: 0 14px 34px rgba(88, 95, 99, 0.08);
      --shadow-soft: 0 8px 20px rgba(88, 95, 99, 0.05);
      --radius-xl: 28px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #f9f7f4 0%, #f8f6f3 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 20px 14px calc(28px + var(--safe-bottom));
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 520px);
      display: grid;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 2px 0;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.01em;
    }

    .meta span {
      white-space: nowrap;
    }

    .meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #c8cbce;
      flex-shrink: 0;
    }

    .icon-button,
    .action-button,
    .number-button,
    .sheet-close,
    .chip,
    .toggle {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      color: var(--text);
      transition: transform 160ms ease, opacity 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }

    .icon-button:active,
    .action-button:active,
    .number-button:active,
    .sheet-close:active,
    .chip:active,
    .toggle:active {
      transform: scale(0.97);
    }

    .icon-button {
      border-radius: 999px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow-soft);
    }

    .card,
    .toolbar,
    .number-panel,
    .settings-sheet,
    .toast,
    .victory-card {
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card {
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .board-shell {
      position: relative;
      padding: 14px;
    }

    .board-status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 0 4px 12px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .board-status strong {
      color: var(--text);
      font-weight: 560;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--frame);
      border-radius: 24px;
      overflow: hidden;
      background: #ffffff;
      position: relative;
      isolation: isolate;
    }

    .cell {
      position: relative;
      border: 1px solid var(--line);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      transition: background-color 120ms ease, box-shadow 120ms ease, outline-color 120ms ease;
    }

    .cell[data-box-right="true"] {
      border-right: 1.5px solid var(--line-strong);
    }

    .cell[data-box-bottom="true"] {
      border-bottom: 1.5px solid var(--line-strong);
    }

    .cell.selected {
      background: var(--selected);
      outline: 2px solid rgba(44, 95, 95, 0.72);
      outline-offset: -2px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6), 0 0 0 3px rgba(44, 95, 95, 0.08);
      z-index: 2;
    }

    .cell.peer {
      background: var(--peer);
    }

    .cell.same-value {
      background: var(--same);
    }

    .cell.given .value {
      color: var(--text);
      font-weight: 430;
    }

    .cell.player .value {
      color: var(--player);
      font-weight: 560;
    }

    .cell.conflict {
      background: var(--conflict);
      box-shadow: inset 0 0 0 1.5px rgba(217, 181, 181, 0.55);
    }

    .cell.conflict-flash {
      animation: conflictFlash 260ms ease;
    }

    .cell.fill-pop {
      animation: fillPop 180ms ease;
    }

    .cell.win-glow {
      animation: winGlow 220ms ease;
    }

    .value {
      font-size: clamp(1.1rem, 4vw, 1.68rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .notes {
      position: absolute;
      inset: 6px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 2px;
      align-items: center;
      justify-items: center;
      color: #8b8f93;
      font-size: clamp(0.48rem, 1.8vw, 0.62rem);
      line-height: 1;
      pointer-events: none;
    }

    .note {
      opacity: 0;
      transform: scale(0.88);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .note.visible {
      opacity: 1;
      transform: scale(1);
    }

    .toolbar {
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.72);
    }

    .tool-row {
      display: grid;
      gap: 10px;
    }

    .tool-row.primary {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .tool-row.secondary {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .action-button {
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: inset 0 0 0 1px rgba(226, 228, 230, 0.7);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.94rem;
      font-weight: 560;
    }

    .action-button.active {
      background: rgba(44, 95, 95, 0.12);
      color: var(--player);
      box-shadow: inset 0 0 0 1px rgba(44, 95, 95, 0.14);
    }

    .action-button:disabled,
    .number-button:disabled {
      opacity: 0.38;
    }

    .number-panel {
      position: sticky;
      bottom: 0;
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.74);
    }

    .number-panel.disabled {
      opacity: 0.55;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .number-footer {
      display: flex;
      justify-content: center;
    }

    .number-button {
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 0 0 1px rgba(226, 228, 230, 0.82);
      color: var(--player);
      font-size: 1.08rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .number-button.selected-value {
      background: rgba(44, 95, 95, 0.11);
      box-shadow: inset 0 0 0 1px rgba(44, 95, 95, 0.16);
    }

    .number-button.note-target::after {
      content: "·";
      margin-left: 4px;
      color: var(--muted);
    }

    .number-button.clear-button {
      min-width: 132px;
      padding: 0 18px;
      color: var(--text);
      gap: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(55, 60, 64, 0.14);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-sheet {
      position: fixed;
      left: 50%;
      bottom: calc(16px + var(--safe-bottom));
      width: min(calc(100% - 28px), 520px);
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 18px;
      display: grid;
      gap: 16px;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .settings-sheet.open {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sheet-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 650;
    }

    .sheet-close {
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.05);
    }

    .sheet-group {
      display: grid;
      gap: 10px;
    }

    .sheet-label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .chip-row,
    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      border-radius: 999px;
      padding: 0 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: inset 0 0 0 1px rgba(226, 228, 230, 0.82);
    }

    .chip.active {
      background: rgba(44, 95, 95, 0.12);
      color: var(--player);
      box-shadow: inset 0 0 0 1px rgba(44, 95, 95, 0.15);
    }

    .toggle-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .toggle {
      border-radius: 18px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: inset 0 0 0 1px rgba(226, 228, 230, 0.82);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }

    .toggle strong {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .toggle span {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .toggle.active {
      background: rgba(44, 95, 95, 0.12);
      box-shadow: inset 0 0 0 1px rgba(44, 95, 95, 0.15);
    }

    .toggle-indicator {
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.12);
      position: relative;
      flex-shrink: 0;
      transition: background-color 160ms ease;
    }

    .toggle-indicator::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      transition: transform 160ms ease;
    }

    .toggle.active .toggle-indicator {
      background: rgba(44, 95, 95, 0.42);
    }

    .toggle.active .toggle-indicator::after {
      transform: translateX(14px);
    }

    .toast,
    .victory-card {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .toast {
      bottom: calc(104px + var(--safe-bottom));
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 0.88rem;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    .victory-card {
      top: 50%;
      width: min(calc(100% - 48px), 308px);
      border-radius: 24px;
      padding: 20px 18px;
      transform: translate(-50%, -46%);
    }

    .victory-card.show {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .victory-card h2 {
      margin: 0 0 6px;
      font-size: 1.36rem;
    }

    .victory-card p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      font-size: 18px;
      line-height: 1;
      color: rgba(227, 218, 201, 0.95);
      text-shadow: 0 4px 10px rgba(160, 150, 140, 0.15);
      opacity: 0;
      animation: fall linear forwards;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    @keyframes fillPop {
      0% { transform: scale(0.93); }
      72% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    @keyframes conflictFlash {
      0% { box-shadow: inset 0 0 0 0 rgba(217, 181, 181, 0); }
      50% { box-shadow: inset 0 0 0 2px rgba(217, 181, 181, 0.55); }
      100% { box-shadow: inset 0 0 0 0 rgba(217, 181, 181, 0); }
    }

    @keyframes winGlow {
      0% { box-shadow: inset 0 0 0 0 rgba(204, 183, 127, 0); }
      50% { box-shadow: inset 0 0 0 2px rgba(204, 183, 127, 0.4); }
      100% { box-shadow: inset 0 0 0 0 rgba(204, 183, 127, 0); }
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -10vh, 0) rotate(0deg);
        opacity: 0;
      }
      8% {
        opacity: 0.88;
      }
      100% {
        transform: translate3d(var(--drift), 110vh, 0) rotate(300deg);
        opacity: 0;
      }
    }

    @media (min-width: 760px) and (orientation: landscape) {
      body {
        padding-top: 24px;
      }

      .app {
        width: min(100%, 940px);
        grid-template-columns: minmax(320px, 1fr) minmax(270px, 320px);
        grid-template-areas:
          "top top"
          "board side"
          "panel side";
        align-items: start;
      }

      .topbar {
        grid-area: top;
      }

      .board-card {
        grid-area: board;
      }

      .toolbar {
        grid-area: side;
      }

      .number-panel {
        grid-area: panel;
        position: static;
      }

      .toast {
        bottom: 34px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="清风数独游戏">
    <header class="topbar">
      <div class="brand">
        <h1 class="title">清风数独</h1>
        <div class="meta" aria-label="当前游戏状态">
          <span id="difficultyLabel">简单</span>
          <span class="meta-dot" aria-hidden="true"></span>
          <span id="remainingLabel">剩余 0 格</span>
        </div>
      </div>
      <button class="icon-button" id="settingsButton" type="button" aria-label="打开设置">
        <span aria-hidden="true">⚙️</span>
      </button>
    </header>

    <section class="card board-card">
      <div class="board-shell">
        <div class="board-status">
          <span id="modeLabel">填数字</span>
          <strong id="selectionLabel">请选择空格</strong>
        </div>
        <div class="board" id="board" role="grid" aria-label="9乘9数独盘面"></div>
      </div>
    </section>

    <section class="toolbar" aria-label="功能操作">
      <div class="tool-row primary">
        <button class="action-button" id="resetButton" type="button" aria-label="重置当前游戏">
          <span aria-hidden="true">⟲</span>
          <span>重置</span>
        </button>
        <button class="action-button" id="newGameButton" type="button" aria-label="开始新游戏">
          <span aria-hidden="true">🎲</span>
          <span>新游戏</span>
        </button>
      </div>
      <div class="tool-row secondary">
        <button class="action-button" id="noteButton" type="button" aria-label="切换笔记模式" aria-pressed="false">
          <span aria-hidden="true">✏️</span>
          <span>笔记</span>
        </button>
        <button class="action-button" id="undoButton" type="button" aria-label="撤销">
          <span aria-hidden="true">↶</span>
          <span>撤销</span>
        </button>
        <button class="action-button" id="redoButton" type="button" aria-label="重做">
          <span aria-hidden="true">↷</span>
          <span>重做</span>
        </button>
      </div>
    </section>

    <section class="number-panel" id="numberPanel" aria-label="数字输入面板">
      <div class="number-grid" id="numberGrid"></div>
      <div class="number-footer">
        <button class="number-button clear-button" id="clearButton" type="button" data-value="0" aria-label="清除当前格子">
          <span aria-hidden="true">⌫</span>
          <span>清除</span>
        </button>
      </div>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden></div>
  <section class="settings-sheet" id="settingsSheet" aria-label="设置面板" aria-hidden="true">
    <div class="sheet-head">
      <h2 class="sheet-title">游戏设置</h2>
      <button class="sheet-close" id="closeSettingsButton" type="button" aria-label="关闭设置">✕</button>
    </div>
    <div class="sheet-group">
      <span class="sheet-label">选择难度</span>
      <div class="chip-row" id="difficultyChips"></div>
    </div>
    <div class="sheet-group">
      <span class="sheet-label">辅助反馈</span>
      <div class="toggle-row">
        <button class="toggle" id="conflictToggle" type="button" aria-label="切换自动冲突高亮">
          <div>
            <strong>自动冲突高亮</strong>
            <span>实时标记重复数字</span>
          </div>
          <div class="toggle-indicator" aria-hidden="true"></div>
        </button>
        <button class="toggle" id="vibrateToggle" type="button" aria-label="切换震动反馈">
          <div>
            <strong>震动反馈</strong>
            <span>支持设备时启用</span>
          </div>
          <div class="toggle-indicator" aria-hidden="true"></div>
        </button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <section class="victory-card" id="victoryCard" aria-live="polite" aria-hidden="true">
    <h2>🎉 胜利</h2>
    <p>这一局已经完成了，继续开一盘新的吧。</p>
  </section>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="sr-only" id="liveRegion" aria-live="polite"></div>

  <script>
    (() => {
      const STORAGE_KEY = "qingfeng-sudoku-state-v2";
      const HISTORY_LIMIT = 200;
      const DIFFICULTY_LABELS = {
        easy: "简单",
        medium: "中等",
        hard: "困难"
      };

      const PUZZLE_BANK = buildPuzzleBank();

      const elements = {
        board: document.getElementById("board"),
        numberGrid: document.getElementById("numberGrid"),
        numberPanel: document.getElementById("numberPanel"),
        clearButton: document.getElementById("clearButton"),
        noteButton: document.getElementById("noteButton"),
        undoButton: document.getElementById("undoButton"),
        redoButton: document.getElementById("redoButton"),
        resetButton: document.getElementById("resetButton"),
        newGameButton: document.getElementById("newGameButton"),
        settingsButton: document.getElementById("settingsButton"),
        closeSettingsButton: document.getElementById("closeSettingsButton"),
        settingsSheet: document.getElementById("settingsSheet"),
        overlay: document.getElementById("overlay"),
        difficultyLabel: document.getElementById("difficultyLabel"),
        remainingLabel: document.getElementById("remainingLabel"),
        modeLabel: document.getElementById("modeLabel"),
        selectionLabel: document.getElementById("selectionLabel"),
        difficultyChips: document.getElementById("difficultyChips"),
        conflictToggle: document.getElementById("conflictToggle"),
        vibrateToggle: document.getElementById("vibrateToggle"),
        toast: document.getElementById("toast"),
        victoryCard: document.getElementById("victoryCard"),
        petals: document.getElementById("petals"),
        liveRegion: document.getElementById("liveRegion")
      };

      const state = {
        settings: {
          autoCheck: true,
          vibration: true
        },
        difficulty: "easy",
        currentPuzzleId: "",
        puzzle: null,
        board: [],
        notes: [],
        selected: null,
        noteMode: false,
        history: [],
        future: [],
        completed: false,
        lastToastTimer: 0,
        victoryTimer: 0,
        pendingSaveFrame: 0
      };

      function buildPuzzleBank() {
        const solvedBoards = [
          "534678912672195348198342567859761423426853791713924856961537284287419635345286179",
          "417369825632158947958724316825437169791586432346912758289643571573291684164875293",
          "962314857134587269857269314349175628721638945685942731518496372476823591293751486",
          "286179543573246819149538267835761924914825736627394158392457681451683972768912345",
          "145327698839654127672918543496185372218473956753296481367542819581769234924831765"
        ];

        const specs = {
          easy: [36, 37, 38, 39, 40],
          medium: [45, 46, 47, 48, 49],
          hard: [54, 55, 56, 57, 58]
        };

        const bank = { easy: [], medium: [], hard: [] };

        Object.entries(specs).forEach(([difficulty, blanks]) => {
          blanks.forEach((blankCount, index) => {
            const base = solvedBoards[index % solvedBoards.length];
            const puzzle = createPuzzleFromSolution(base, blankCount, `${difficulty}-${index}`);
            bank[difficulty].push({
              id: `${difficulty}-${index + 1}`,
              difficulty,
              puzzle,
              solution: base
            });
          });
        });

        return bank;
      }

      function createPuzzleFromSolution(solution, blankCount, seedText) {
        const chars = solution.split("");
        const indexes = Array.from({ length: 81 }, (_, index) => index);
        const order = seededShuffle(indexes, seedFromString(seedText));
        for (let i = 0; i < blankCount; i += 1) {
          chars[order[i]] = "0";
        }
        return chars.join("");
      }

      function seedFromString(input) {
        let seed = 0;
        for (let i = 0; i < input.length; i += 1) {
          seed = (seed * 31 + input.charCodeAt(i)) >>> 0;
        }
        return seed || 1;
      }

      function seededShuffle(items, seed) {
        const array = items.slice();
        let currentSeed = seed;
        for (let i = array.length - 1; i > 0; i -= 1) {
          currentSeed = (currentSeed * 1664525 + 1013904223) >>> 0;
          const j = currentSeed % (i + 1);
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function emptyNotes() {
        return Array.from({ length: 81 }, () => []);
      }

      function parseBoardString(boardString) {
        return boardString.split("").map((char) => Number(char));
      }

      function deepCopyNotes(notes) {
        return notes.map((entry) => entry.slice().sort((a, b) => a - b));
      }

      function snapshotState() {
        return {
          board: state.board.slice(),
          notes: deepCopyNotes(state.notes)
        };
      }

      function restoreSnapshot(snapshot) {
        state.board = snapshot.board.slice();
        state.notes = deepCopyNotes(snapshot.notes);
      }

      function pushHistory(kind, meta = {}) {
        state.history.push({
          kind,
          meta,
          before: snapshotState()
        });
        if (state.history.length > HISTORY_LIMIT) {
          state.history.shift();
        }
        state.future = [];
      }

      function finalizeHistoryEntry() {
        const entry = state.history[state.history.length - 1];
        if (entry && !entry.after) {
          entry.after = snapshotState();
        }
      }

      function scheduleSave() {
        if (state.pendingSaveFrame) {
          cancelAnimationFrame(state.pendingSaveFrame);
        }
        state.pendingSaveFrame = requestAnimationFrame(() => {
          state.pendingSaveFrame = 0;
          saveStateNow();
        });
      }

      function saveStateNow() {
        const payload = {
          settings: state.settings,
          difficulty: state.difficulty,
          currentPuzzleId: state.currentPuzzleId,
          board: state.board,
          notes: state.notes,
          selected: state.selected,
          noteMode: state.noteMode,
          history: state.history.slice(-HISTORY_LIMIT),
          future: state.future.slice(-HISTORY_LIMIT),
          completed: state.completed
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }

      function defaultGameState(difficulty = "easy") {
        const puzzle = pickPuzzle(difficulty);
        return {
          difficulty,
          currentPuzzleId: puzzle.id,
          puzzle,
          board: parseBoardString(puzzle.puzzle),
          notes: emptyNotes(),
          selected: null,
          noteMode: false,
          history: [],
          future: [],
          completed: false
        };
      }

      function pickPuzzle(difficulty, excludeId) {
        const list = PUZZLE_BANK[difficulty];
        const filtered = excludeId ? list.filter((item) => item.id !== excludeId) : list.slice();
        const pool = filtered.length ? filtered : list;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function findPuzzle(id, difficulty) {
        return PUZZLE_BANK[difficulty].find((item) => item.id === id) || null;
      }

      function isValidHistoryEntry(entry) {
        return entry && entry.before && entry.after &&
          Array.isArray(entry.before.board) && entry.before.board.length === 81 &&
          Array.isArray(entry.after.board) && entry.after.board.length === 81 &&
          Array.isArray(entry.before.notes) && entry.before.notes.length === 81 &&
          Array.isArray(entry.after.notes) && entry.after.notes.length === 81;
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            Object.assign(state, defaultGameState("easy"));
            return;
          }

          const saved = JSON.parse(raw);
          state.settings.autoCheck = saved.settings?.autoCheck !== false;
          state.settings.vibration = saved.settings?.vibration !== false;
          const difficulty = saved.difficulty in DIFFICULTY_LABELS ? saved.difficulty : "easy";
          const puzzle = findPuzzle(saved.currentPuzzleId, difficulty) || pickPuzzle(difficulty);

          state.difficulty = difficulty;
          state.currentPuzzleId = puzzle.id;
          state.puzzle = puzzle;
          state.board = Array.isArray(saved.board) && saved.board.length === 81
            ? saved.board.map(Number)
            : parseBoardString(puzzle.puzzle);
          state.notes = Array.isArray(saved.notes) && saved.notes.length === 81
            ? saved.notes.map((entry) => Array.isArray(entry) ? entry.filter((n) => n >= 1 && n <= 9).map(Number) : [])
            : emptyNotes();
          state.selected = Number.isInteger(saved.selected) && saved.selected >= 0 && saved.selected < 81 ? saved.selected : null;
          state.noteMode = Boolean(saved.noteMode);
          state.history = Array.isArray(saved.history) ? saved.history.slice(-HISTORY_LIMIT).filter(isValidHistoryEntry) : [];
          state.future = Array.isArray(saved.future) ? saved.future.slice(-HISTORY_LIMIT).filter(isValidHistoryEntry) : [];
          state.completed = Boolean(saved.completed);
        } catch (error) {
          Object.assign(state, defaultGameState("easy"));
        }
      }

      function createBoard() {
        const fragment = document.createDocumentFragment();
        for (let index = 0; index < 81; index += 1) {
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.index = String(index);
          cell.dataset.boxRight = String(index % 9 === 2 || index % 9 === 5);
          cell.dataset.boxBottom = String(Math.floor(index / 9) === 2 || Math.floor(index / 9) === 5);
          cell.setAttribute("role", "gridcell");

          const value = document.createElement("span");
          value.className = "value";
          cell.appendChild(value);

          const notes = document.createElement("div");
          notes.className = "notes";
          for (let n = 0; n < 4; n += 1) {
            const note = document.createElement("span");
            note.className = "note";
            notes.appendChild(note);
          }
          cell.appendChild(notes);
          fragment.appendChild(cell);
        }
        elements.board.appendChild(fragment);
      }

      function createNumberPanel() {
        const fragment = document.createDocumentFragment();
        for (let n = 1; n <= 9; n += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "number-button";
          button.dataset.value = String(n);
          button.setAttribute("aria-label", `输入数字 ${n}`);
          button.textContent = String(n);
          fragment.appendChild(button);
        }
        elements.numberGrid.appendChild(fragment);
      }

      function createDifficultyChips() {
        const fragment = document.createDocumentFragment();
        Object.entries(DIFFICULTY_LABELS).forEach(([value, label]) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.dataset.difficulty = value;
          chip.textContent = label;
          chip.setAttribute("aria-label", `切换到${label}难度`);
          fragment.appendChild(chip);
        });
        elements.difficultyChips.appendChild(fragment);
      }

      function rowOf(index) {
        return Math.floor(index / 9);
      }

      function colOf(index) {
        return index % 9;
      }

      function boxOf(index) {
        return Math.floor(rowOf(index) / 3) * 3 + Math.floor(colOf(index) / 3);
      }

      function puzzleGivenAt(index) {
        return state.puzzle.puzzle[index] !== "0";
      }

      function getConflicts(board) {
        const conflictSet = new Set();

        function markGroup(indexes) {
          const buckets = new Map();
          indexes.forEach((index) => {
            const value = board[index];
            if (!value || puzzleGivenAt(index)) {
              return;
            }
            if (!buckets.has(value)) {
              buckets.set(value, []);
            }
            buckets.get(value).push(index);
          });
          buckets.forEach((group) => {
            if (group.length > 1) {
              group.forEach((index) => conflictSet.add(index));
            }
          });
        }

        for (let row = 0; row < 9; row += 1) {
          markGroup(Array.from({ length: 9 }, (_, col) => row * 9 + col));
        }
        for (let col = 0; col < 9; col += 1) {
          markGroup(Array.from({ length: 9 }, (_, row) => row * 9 + col));
        }
        for (let box = 0; box < 9; box += 1) {
          const startRow = Math.floor(box / 3) * 3;
          const startCol = (box % 3) * 3;
          const indexes = [];
          for (let r = 0; r < 3; r += 1) {
            for (let c = 0; c < 3; c += 1) {
              indexes.push((startRow + r) * 9 + (startCol + c));
            }
          }
          markGroup(indexes);
        }

        return conflictSet;
      }

      function canEdit(index) {
        return index !== null && !puzzleGivenAt(index);
      }

      function selectCell(index, { silent = false } = {}) {
        state.selected = index;
        if (!silent) {
          pulseVibration(40);
        }
        render();
      }

      function toggleNoteMode() {
        state.noteMode = !state.noteMode;
        pulseVibration(40);
        render();
        scheduleSave();
      }

      function handleCellPress(index) {
        if (state.selected === index) {
          return;
        }
        selectCell(index);
      }

      function applyInput(rawValue) {
        if (state.selected === null || !canEdit(state.selected) || state.completed) {
          showToast("请先选择一个可填写的空格");
          return;
        }

        const value = Number(rawValue);
        pushHistory(state.noteMode ? "note" : "fill", { index: state.selected, value });

        if (state.noteMode) {
          toggleNoteAt(state.selected, value);
        } else {
          setCellValue(state.selected, value);
        }

        finalizeHistoryEntry();
        state.completed = false;
        render({ animatedIndex: state.selected, recentConflictCheck: true });
        scheduleSave();
        maybeCelebrate();
      }

      function toggleNoteAt(index, value) {
        if (value === 0) {
          state.notes[index] = [];
          return;
        }

        if (state.board[index] !== 0) {
          state.board[index] = 0;
        }

        const notes = new Set(state.notes[index]);
        if (notes.has(value)) {
          notes.delete(value);
        } else {
          notes.add(value);
        }
        state.notes[index] = Array.from(notes).sort((a, b) => a - b);
      }

      function setCellValue(index, value) {
        const previous = state.board[index];
        state.board[index] = previous === value ? 0 : value;
        if (value !== 0) {
          state.notes[index] = [];
        }
      }

      function undo() {
        const entry = state.history.pop();
        if (!entry) {
          return;
        }
        state.future.push(entry);
        restoreSnapshot(entry.before);
        state.completed = false;
        pulseVibration(40);
        render();
        scheduleSave();
      }

      function redo() {
        const entry = state.future.pop();
        if (!entry) {
          return;
        }
        state.history.push(entry);
        restoreSnapshot(entry.after);
        state.completed = false;
        pulseVibration(40);
        render();
        scheduleSave();
        maybeCelebrate();
      }

      function resetGame() {
        pushHistory("reset");
        state.board = parseBoardString(state.puzzle.puzzle);
        state.notes = emptyNotes();
        state.selected = null;
        state.completed = false;
        finalizeHistoryEntry();
        pulseVibration(40);
        render();
        scheduleSave();
        showToast("当前题目已重置");
      }

      function startNewGame(nextDifficulty = state.difficulty, options = {}) {
        const puzzle = pickPuzzle(nextDifficulty, options.keepDifferent === false ? undefined : state.currentPuzzleId);
        state.difficulty = nextDifficulty;
        state.currentPuzzleId = puzzle.id;
        state.puzzle = puzzle;
        state.board = parseBoardString(puzzle.puzzle);
        state.notes = emptyNotes();
        state.selected = null;
        state.noteMode = false;
        state.history = [];
        state.future = [];
        state.completed = false;
        render();
        scheduleSave();
        showToast(`${DIFFICULTY_LABELS[nextDifficulty]}难度，新的题目已准备好`);
      }

      function setDifficulty(nextDifficulty) {
        if (nextDifficulty === state.difficulty) {
          return;
        }
        pulseVibration(40);
        closeSettings();
        startNewGame(nextDifficulty, { keepDifferent: false });
      }

      function toggleSetting(key) {
        state.settings[key] = !state.settings[key];
        if (key === "vibration" && state.settings[key]) {
          navigator.vibrate?.(24);
        }
        render();
        scheduleSave();
      }

      function openSettings() {
        elements.overlay.hidden = false;
        elements.overlay.classList.add("open");
        elements.settingsSheet.classList.add("open");
        elements.settingsSheet.setAttribute("aria-hidden", "false");
      }

      function closeSettings() {
        elements.overlay.classList.remove("open");
        elements.settingsSheet.classList.remove("open");
        elements.settingsSheet.setAttribute("aria-hidden", "true");
        setTimeout(() => {
          if (!elements.overlay.classList.contains("open")) {
            elements.overlay.hidden = true;
          }
        }, 180);
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.classList.add("show");
        clearTimeout(state.lastToastTimer);
        state.lastToastTimer = setTimeout(() => {
          elements.toast.classList.remove("show");
        }, 1500);
        announce(message);
      }

      function announce(message) {
        elements.liveRegion.textContent = "";
        setTimeout(() => {
          elements.liveRegion.textContent = message;
        }, 16);
      }

      function pulseVibration(duration) {
        if (!state.settings.vibration) {
          return;
        }
        navigator.vibrate?.(duration);
      }

      function maybeCelebrate() {
        const conflicts = getConflicts(state.board);
        const isFilled = state.board.every((value) => value >= 1 && value <= 9);
        if (!isFilled || conflicts.size > 0 || state.completed) {
          return;
        }
        state.completed = true;
        render();
        scheduleSave();
        showVictory();
      }

      function showVictory() {
        elements.victoryCard.classList.add("show");
        elements.victoryCard.setAttribute("aria-hidden", "false");
        pulseVibration(80);
        sprinklePetals();
        flashBoard();
        announce("胜利，当前数独已完成");
        clearTimeout(state.victoryTimer);
        state.victoryTimer = setTimeout(() => {
          elements.victoryCard.classList.remove("show");
          elements.victoryCard.setAttribute("aria-hidden", "true");
        }, 2100);
      }

      function flashBoard() {
        elements.board.querySelectorAll(".cell").forEach((cell, index) => {
          setTimeout(() => {
            cell.classList.add("win-glow");
            setTimeout(() => cell.classList.remove("win-glow"), 220);
          }, (index % 9) * 10);
        });
      }

      function sprinklePetals() {
        elements.petals.innerHTML = "";
        const origins = [
          { left: 4, top: -8, driftBase: 140 },
          { left: 88, top: -8, driftBase: -140 },
          { left: 10, top: 12, driftBase: 110 },
          { left: 84, top: 12, driftBase: -110 }
        ];

        for (let i = 0; i < 24; i += 1) {
          const origin = origins[i % origins.length];
          const petal = document.createElement("span");
          petal.className = "petal";
          petal.textContent = "❀";
          petal.style.left = `${origin.left + Math.random() * 8}%`;
          petal.style.top = `${origin.top + Math.random() * 6}%`;
          petal.style.setProperty("--drift", `${origin.driftBase + (Math.random() - 0.5) * 80}px`);
          petal.style.animationDuration = `${2200 + Math.random() * 900}ms`;
          petal.style.animationDelay = `${Math.random() * 180}ms`;
          elements.petals.appendChild(petal);
        }

        setTimeout(() => {
          elements.petals.innerHTML = "";
        }, 3300);
      }

      function attachEvents() {
        elements.board.addEventListener("click", (event) => {
          const target = event.target.closest(".cell");
          if (!target) {
            return;
          }
          handleCellPress(Number(target.dataset.index));
        });

        elements.numberGrid.addEventListener("click", (event) => {
          const button = event.target.closest(".number-button");
          if (!button) {
            return;
          }
          pulseVibration(40);
          applyInput(button.dataset.value);
        });

        elements.clearButton.addEventListener("click", () => {
          pulseVibration(40);
          applyInput("0");
        });

        elements.noteButton.addEventListener("click", toggleNoteMode);
        elements.undoButton.addEventListener("click", undo);
        elements.redoButton.addEventListener("click", redo);
        elements.resetButton.addEventListener("click", resetGame);
        elements.newGameButton.addEventListener("click", () => {
          pulseVibration(40);
          startNewGame(state.difficulty);
        });
        elements.settingsButton.addEventListener("click", () => {
          pulseVibration(40);
          openSettings();
        });
        elements.closeSettingsButton.addEventListener("click", closeSettings);
        elements.overlay.addEventListener("click", closeSettings);
        elements.conflictToggle.addEventListener("click", () => toggleSetting("autoCheck"));
        elements.vibrateToggle.addEventListener("click", () => toggleSetting("vibration"));
        elements.difficultyChips.addEventListener("click", (event) => {
          const chip = event.target.closest(".chip");
          if (!chip) {
            return;
          }
          setDifficulty(chip.dataset.difficulty);
        });

        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeSettings();
            return;
          }

          if (event.key.toLowerCase() === "z" && (event.ctrlKey || event.metaKey) && !event.shiftKey) {
            event.preventDefault();
            undo();
            return;
          }

          if (
            (event.key.toLowerCase() === "z" && (event.ctrlKey || event.metaKey) && event.shiftKey) ||
            (event.key.toLowerCase() === "y" && (event.ctrlKey || event.metaKey))
          ) {
            event.preventDefault();
            redo();
            return;
          }

          if (event.key.toLowerCase() === "n") {
            event.preventDefault();
            toggleNoteMode();
            return;
          }

          if (/^[1-9]$/.test(event.key)) {
            event.preventDefault();
            applyInput(event.key);
            return;
          }

          if (["Backspace", "Delete", "0"].includes(event.key)) {
            event.preventDefault();
            applyInput("0");
            return;
          }

          if (state.selected === null) {
            return;
          }

          if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
            event.preventDefault();
            const next = moveSelection(state.selected, event.key);
            if (next !== null) {
              selectCell(next, { silent: true });
            }
          }
        });
      }

      function moveSelection(index, key) {
        const row = rowOf(index);
        const col = colOf(index);
        if (key === "ArrowUp" && row > 0) return index - 9;
        if (key === "ArrowDown" && row < 8) return index + 9;
        if (key === "ArrowLeft" && col > 0) return index - 1;
        if (key === "ArrowRight" && col < 8) return index + 1;
        return null;
      }

      function formatSelectionLabel() {
        if (state.selected === null) {
          return "请选择空格";
        }
        if (!canEdit(state.selected)) {
          return "该格为预置数字";
        }
        return `第 ${rowOf(state.selected) + 1} 行，第 ${colOf(state.selected) + 1} 列`;
      }

      function summarizeNotes(notes) {
        if (!notes.length) {
          return "";
        }
        if (notes.length <= 4) {
          return notes.join(" ");
        }
        return `${notes.slice(0, 3).join(" ")} …`;
      }

      function render(options = {}) {
        const conflicts = state.settings.autoCheck ? getConflicts(state.board) : new Set();
        const selectedValue = state.selected !== null ? state.board[state.selected] : 0;
        const selectedRow = state.selected !== null ? rowOf(state.selected) : -1;
        const selectedCol = state.selected !== null ? colOf(state.selected) : -1;
        const selectedBox = state.selected !== null ? boxOf(state.selected) : -1;
        const recentConflictIndexes = options.recentConflictCheck ? Array.from(conflicts) : [];

        elements.board.querySelectorAll(".cell").forEach((cell, index) => {
          const value = state.board[index];
          const isGiven = puzzleGivenAt(index);
          const isSelected = state.selected === index;
          const isPeer = state.selected !== null && !isSelected &&
            (rowOf(index) === selectedRow || colOf(index) === selectedCol || boxOf(index) === selectedBox);
          const isSameValue = selectedValue !== 0 && value === selectedValue && !isSelected;
          const isConflict = conflicts.has(index);

          cell.classList.toggle("given", isGiven);
          cell.classList.toggle("player", !isGiven && value !== 0);
          cell.classList.toggle("selected", isSelected);
          cell.classList.toggle("peer", isPeer);
          cell.classList.toggle("same-value", isSameValue);
          cell.classList.toggle("conflict", isConflict);

          const valueNode = cell.querySelector(".value");
          valueNode.textContent = value ? String(value) : "";

          const notesNode = cell.querySelector(".notes");
          notesNode.hidden = value !== 0;
          const compactNotes = state.notes[index].length <= 4 ? state.notes[index] : [...state.notes[index].slice(0, 3), "…"];
          notesNode.querySelectorAll(".note").forEach((noteNode, noteIndex) => {
            const noteValue = compactNotes[noteIndex];
            const visible = noteValue !== undefined && value === 0;
            noteNode.textContent = visible ? String(noteValue) : "";
            noteNode.classList.toggle("visible", visible);
          });

          const positionLabel = `第 ${rowOf(index) + 1} 行第 ${colOf(index) + 1} 列`;
          const stateLabel = isGiven
            ? `预置数字 ${value}`
            : value
              ? `已填数字 ${value}`
              : state.notes[index].length
                ? `笔记 ${summarizeNotes(state.notes[index])}`
                : "空格";
          cell.setAttribute("aria-label", `${positionLabel}，${stateLabel}`);

          if (options.animatedIndex === index && value !== 0 && !state.noteMode) {
            cell.classList.remove("fill-pop");
            void cell.offsetWidth;
            cell.classList.add("fill-pop");
            setTimeout(() => cell.classList.remove("fill-pop"), 190);
          }
        });

        if (recentConflictIndexes.length) {
          recentConflictIndexes.forEach((index) => {
            const cell = elements.board.querySelector(`.cell[data-index="${index}"]`);
            if (!cell) {
              return;
            }
            cell.classList.remove("conflict-flash");
            void cell.offsetWidth;
            cell.classList.add("conflict-flash");
            setTimeout(() => cell.classList.remove("conflict-flash"), 280);
          });
          pulseVibration(24);
        }

        const panelDisabled = state.selected === null || !canEdit(state.selected) || state.completed;
        elements.numberPanel.classList.toggle("disabled", panelDisabled);

        elements.numberGrid.querySelectorAll(".number-button").forEach((button) => {
          const buttonValue = Number(button.dataset.value);
          button.disabled = panelDisabled;
          button.classList.toggle("selected-value", state.selected !== null && state.board[state.selected] === buttonValue && buttonValue !== 0);
          button.classList.toggle("note-target", state.noteMode && buttonValue !== 0);
        });

        elements.clearButton.disabled = panelDisabled;
        elements.noteButton.classList.toggle("active", state.noteMode);
        elements.noteButton.setAttribute("aria-pressed", String(state.noteMode));
        elements.undoButton.disabled = state.history.length === 0;
        elements.redoButton.disabled = state.future.length === 0;

        elements.difficultyLabel.textContent = DIFFICULTY_LABELS[state.difficulty];
        elements.remainingLabel.textContent = `剩余 ${state.board.filter((value) => value === 0).length} 格`;
        elements.modeLabel.textContent = state.noteMode ? "笔记模式" : "填数字";
        elements.selectionLabel.textContent = formatSelectionLabel();

        elements.conflictToggle.classList.toggle("active", state.settings.autoCheck);
        elements.vibrateToggle.classList.toggle("active", state.settings.vibration);
        elements.difficultyChips.querySelectorAll(".chip").forEach((chip) => {
          chip.classList.toggle("active", chip.dataset.difficulty === state.difficulty);
        });
      }

      loadState();
      createBoard();
      createNumberPanel();
      createDifficultyChips();
      attachEvents();
      render();
      maybeCelebrate();
